name: Run .py for Broker_holdings from Broker_Analysis.xlsx

on:
  push:
    paths: 
      - 'Broker_Analysis.xlsx'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies (for Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev libtiff-dev libfreetype6-dev

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping installation."
          fi

      - name: Run Broker_holdings.py
        env:
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}  
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}  
          COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}    
          USER_EMAIL: ${{ secrets.USER_EMAIL }}    
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}    
        run: python "Broker_holdings.py"

